    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        background-color: #FAF7F2;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FAF7F2;
      }
      ::-webkit-scrollbar-thumb {
        background: #D4C4B0;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B8A894;
      }

      /* Entrance animations */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(30px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .anim-fade-up {
        animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .anim-fade-in {
        animation: fadeIn 0.5s ease-out both;
      }
      .anim-scale-in {
        animation: scaleIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .anim-slide-in {
        animation: slideInRight 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* Stagger children in grid */
      .stagger-grid > * {
        opacity: 0;
        animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .stagger-grid > *:nth-child(1) { animation-delay: 0.00s; }
      .stagger-grid > *:nth-child(2) { animation-delay: 0.06s; }
      .stagger-grid > *:nth-child(3) { animation-delay: 0.12s; }
      .stagger-grid > *:nth-child(4) { animation-delay: 0.18s; }
      .stagger-grid > *:nth-child(5) { animation-delay: 0.24s; }
      .stagger-grid > *:nth-child(6) { animation-delay: 0.30s; }
      .stagger-grid > *:nth-child(7) { animation-delay: 0.36s; }
      .stagger-grid > *:nth-child(8) { animation-delay: 0.42s; }
      .stagger-grid > *:nth-child(9) { animation-delay: 0.48s; }
      .stagger-grid > *:nth-child(10) { animation-delay: 0.54s; }
      .stagger-grid > *:nth-child(11) { animation-delay: 0.60s; }
      .stagger-grid > *:nth-child(12) { animation-delay: 0.66s; }

      /* Card hover lift */
      .card-lift {
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card-lift:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px -8px rgba(60, 30, 20, 0.14),
                    0 8px 16px -4px rgba(60, 30, 20, 0.08);
      }

      /* Button press */
      .btn-press {
        transition: transform 0.15s ease, box-shadow 0.25s ease, background-color 0.25s ease;
      }
      .btn-press:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px -4px rgba(184, 68, 47, 0.35);
      }
      .btn-press:active {
        transform: translateY(0) scale(0.98);
        box-shadow: 0 4px 12px -2px rgba(184, 68, 47, 0.25);
      }

      /* Image zoom on card hover */
      .img-zoom {
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .group:hover .img-zoom {
        transform: scale(1.08);
      }

      /* Search glow on focus */
      .search-glow:focus {
        box-shadow: 0 0 0 4px rgba(184, 68, 47, 0.15), 0 12px 40px -8px rgba(60, 30, 20, 0.18);
      }

      /* Modal backdrop */
      .modal-backdrop {
        animation: fadeIn 0.25s ease both;
      }
      .modal-panel {
        animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
    </style>
